<svg width="375" height="376" viewBox="0 0 375 376" fill="none" xmlns="http://www.w3.org/2000/svg">

    <defs>

        <!-- Light Background -->
        <radialGradient id="bg" cx="50%" cy="18%" r="90%">
            <stop offset="0%" stop-color="#FFF4E2"/>
            <stop offset="35%" stop-color="#F6E8D0"/>
            <stop offset="70%" stop-color="#EBD4B5"/>
            <stop offset="100%" stop-color="#D9B985"/>
        </radialGradient>

        <!-- Gold Glow -->
        <radialGradient id="orangeGlow">
            <stop offset="0%" stop-color="#D4A04A" stop-opacity=".28"/>
            <stop offset="100%" stop-color="#D4A04A" stop-opacity="0"/>
        </radialGradient>

        <!-- Light Glow -->
        <radialGradient id="whiteGlow">
            <stop offset="0%" stop-color="#FFF4E2" stop-opacity=".65"/>
            <stop offset="100%" stop-color="#FFF4E2" stop-opacity="0"/>
        </radialGradient>

    </defs>

    <!-- Main Circle -->
    <circle
        cx="195"
        cy="-77"
        r="453"
        fill="url(#bg)"
    />

    <!-- Gold Glow -->
    <circle
        cx="70"
        cy="120"
        r="120"
        fill="url(#orangeGlow)"
    />

    <!-- Light Glow -->
    <circle
        cx="330"
        cy="60"
        r="90"
        fill="url(#whiteGlow)"
    />

    <!-- Center Glow -->
    <circle
        cx="190"
        cy="170"
        r="150"
        fill="url(#orangeGlow)"
        opacity=".5"
    />

    <!-- Decorative Circles -->
    <circle cx="45" cy="55" r="3" fill="#4A2C1A" opacity=".08"/>
    <circle cx="85" cy="95" r="2" fill="#4A2C1A" opacity=".08"/>
    <circle cx="125" cy="70" r="2" fill="#4A2C1A" opacity=".08"/>
    <circle cx="285" cy="105" r="3" fill="#4A2C1A" opacity=".08"/>
    <circle cx="320" cy="150" r="2" fill="#4A2C1A" opacity=".08"/>
    <circle cx="250" cy="55" r="2" fill="#4A2C1A" opacity=".08"/>
    <circle cx="150" cy="120" r="2" fill="#4A2C1A" opacity=".08"/>

    <!-- Decorative Lines -->
    <rect
        x="15"
        y="190"
        width="90"
        height="2"
        rx="2"
        fill="#D4A04A"
        opacity=".35"
        transform="rotate(-20 15 190)"
    />

    <rect
        x="285"
        y="210"
        width="70"
        height="2"
        rx="2"
        fill="#8B5E34"
        opacity=".18"
        transform="rotate(20 285 210)"
    />

</svg>
